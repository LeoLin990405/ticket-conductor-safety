<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ticket Conductor — a restricted Rovo supervisor that runs one Jira Epic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 40) rotate(125) scale(260)">
      <stop stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 250) rotate(-35) scale(300)">
      <stop stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="23.5" stroke="#1E293B"/>
  <rect width="1200" height="280" rx="24" fill="url(#glow1)"/>
  <rect width="1200" height="280" rx="24" fill="url(#glow2)"/>
  <path d="M0 210 C 220 160, 420 250, 640 210 S 1040 150, 1200 195" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="64" y="118" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#F8FAFC" letter-spacing="-2">Ticket Conductor</text>
  <text x="66" y="162" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#CBD5E1">A restricted Rovo supervisor for one Jira Epic</text>
  <text x="66" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#94A3B8">rovo:agent · async workers · idempotent effects · flight recorder</text>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">
    <rect x="66" y="222" width="112" height="28" rx="14" fill="#0F172A" stroke="#334155"/>
    <text x="82" y="241" fill="#7DD3FC">Forge 14.2.0</text>
    <rect x="190" y="222" width="118" height="28" rx="14" fill="#0F172A" stroke="#334155"/>
    <text x="206" y="241" fill="#A5B4FC">Node 22.23.x</text>
    <rect x="320" y="222" width="106" height="28" rx="14" fill="#0F172A" stroke="#334155"/>
    <text x="336" y="241" fill="#6EE7B7">rovo:agent</text>
    <rect x="438" y="222" width="124" height="28" rx="14" fill="#0F172A" stroke="#334155"/>
    <text x="454" y="241" fill="#F0ABFC">dev site only</text>
  </g>
  <g transform="translate(940 70)">
    <rect x="0" y="0" width="196" height="140" rx="16" fill="#0F172A" stroke="#334155" stroke-opacity="0.9"/>
    <circle cx="22" cy="22" r="4" fill="#F87171"/><circle cx="38" cy="22" r="4" fill="#FBBF24"/><circle cx="54" cy="22" r="4" fill="#34D399"/>
    <text x="18" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748B">$ forge deploy -e dev</text>
    <text x="18" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">plan-split -&gt; 3 steps</text>
    <text x="18" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#A78BFA">3 workers -&gt; effects</text>
    <text x="18" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6EE7B7">memory -&gt; Epic comment</text>
